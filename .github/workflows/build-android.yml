name: Build Android APK

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build Go filters .aar
        run: |
          cd gofilters
          go mod tidy
          gomobile bind -target=android/arm64,android/amd64 -androidapi 24 -o ../android/app/libs/gofilters.aar .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint -x test -x lintVitalReportRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobiMorphoun-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: MobiMorphoun ${{ github.ref_name }}
          body: |
            ## MobiMorphoun ${{ github.ref_name }}
            
            Android wallpaper changer with quote overlays.
            
            ### Install
            Download `app-release.apk` and install on your Android device.
            (Enable "Install from unknown sources" in settings)
